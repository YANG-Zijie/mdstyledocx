[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mdstyledocx"
version = "0.2.0"
description = "Convert convention-based Markdown into standardized DOCX with reusable style presets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "YANG Zijie" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
mdstyledocx = "mdstyledocx.cli:main"

[project.urls]
Homepage = "https://github.com/YANG-Zijie/mdstyledocx"
Repository = "https://github.com/YANG-Zijie/mdstyledocx"
Issues = "https://github.com/YANG-Zijie/mdstyledocx/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdstyledocx = ["preset.schema.json", "preset_specs/*.json", "preset_specs/*.md"]
