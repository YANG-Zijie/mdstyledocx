name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) RELEASE_VERSION="${RELEASE_TAG#v}" ;;
            *)
              echo "::error::Release tag must start with 'v' (for example, v0.2.0)."
              exit 1
              ;;
          esac

          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PACKAGE_VERSION="$(uv run python -c 'import mdstyledocx; print(mdstyledocx.__version__)')"

          if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Release tag version $RELEASE_VERSION does not match pyproject.toml version $PROJECT_VERSION."
            exit 1
          fi

          if [ "$PROJECT_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::pyproject.toml version $PROJECT_VERSION does not match mdstyledocx.__version__ $PACKAGE_VERSION."
            exit 1
          fi
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mdstyledocx
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true
